    <text x="0" y="-30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">N</text>
  </g>

  <rect x="420" y="50" width="550" height="700" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="8,8" opacity="0.5"></rect>
  <text x="695" y="40" font-family="Arial" font-size="12" font-weight="bold" fill="#7f8c8d" text-anchor="middle" opacity="0.8">MAIN BLOCK (THE GLEBE) - NORTH-CENTRAL</text>

