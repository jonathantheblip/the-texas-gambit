    <rect x="10" y="485" width="45" height="50" fill="#17202a" stroke="#555" stroke-width="1"></rect> <circle cx="22" cy="497" r="8" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="2,2"></circle>
