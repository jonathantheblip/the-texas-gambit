<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <pattern id="pex-slab" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#fffaf0"></rect>
      <path d="M 0 10 Q 5 0 10 10 T 20 10" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.4"></path>
      <path d="M 0 20 Q 5 10 10 20 T 20 20" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.4"></path>
    </pattern>

    <pattern id="decking" width="40" height="12" patternUnits="userSpaceOnUse">
      <rect width="40" height="12" fill="#fcf3cf" opacity="0.4"></rect>
      <line x1="0" y1="12" x2="40" y2="12" stroke="#d4ac0d" stroke-width="1" opacity="0.6"></line>
    </pattern>

    <pattern id="stoneVeneer" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#d9cdbc"></rect>
      <path d="M 0,10 L 40,10 M 20,0 L 20,10 M 5,10 L 5,20 M 30,10 L 30,20" stroke="#a39686" stroke-width="1.5"></path>
      <rect x="2" y="2" width="16" height="6" fill="#c7bba8" rx="1"></rect>
      <rect x="22" y="2" width="16" height="6" fill="#e3d8c8" rx="1"></rect>
      <rect x="2" y="12" width="2" height="6" fill="#c7bba8" rx="1"></rect>
      <rect x="7" y="12" width="21" height="6" fill="#bfae99" rx="1"></rect>
    </pattern>
    
    <linearGradient id="stainless" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeded"></stop>
      <stop offset="50%" stop-color="#fcfcfc"></stop>
      <stop offset="100%" stop-color="#d5d8dc"></stop>
    </linearGradient>

    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#566573"></stop>
      <stop offset="100%" stop-color="#2c3e50"></stop>
    </linearGradient>
  </defs>

  <rect width="1100" height="800" fill="#fcfbf8"></rect>

