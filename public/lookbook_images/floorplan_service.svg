    <path d="M 210 110 L 840 110 L 840 210 L 990 210 L 990 590 L 210 590 Z" fill="none" stroke="#dcd7cb" stroke-width="20" opacity="0.4"></path>
    <text x="500" y="130" class="annotation" fill="#7f8c8d" opacity="0.8">36&#34; CRUSHED GRAVEL DRY ZONE (ZERO-FUEL DEFENSIBLE SPACE)</text>

