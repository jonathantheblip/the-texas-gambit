<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        
        <pattern id="pex-slab" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="#fffaf0"></rect>
            <path d="M 0 10 Q 5 0 10 10 T 20 10" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.3"></path>
            <path d="M 0 20 Q 5 10 10 20 T 20 20" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.3"></path>
        </pattern>
        <pattern id="storage-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="8" stroke="#e6b0aa" stroke-width="2"></line>
        </pattern>
        <pattern id="storage-blue-hatch" width="8" height="8" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="8" stroke="#85c1e9" stroke-width="2"></line>
        </pattern>
    </defs>

    <rect width="1200" height="800" fill="#fdfaf0"></rect>

