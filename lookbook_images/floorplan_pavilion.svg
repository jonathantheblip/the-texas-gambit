<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        
        <pattern id="gravel-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="#e0ddd5" opacity="0.3"></rect>
            <circle cx="10" cy="10" r="1.5" fill="#bdc3c7"></circle>
            <circle cx="30" cy="25" r="2" fill="#95a5a6"></circle>
            <circle cx="20" cy="35" r="1" fill="#7f8c8d" opacity="0.5"></circle>
            <circle cx="5" cy="30" r="1.5" fill="#bdc3c7"></circle>
        </pattern>
        <pattern id="storage-hatch-pattern" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="8" stroke="#e6b0aa" stroke-width="2"></line>
        </pattern>
        <pattern id="roof-seam" width="20" height="20" patternUnits="userSpaceOnUse">
            <line x1="10" y1="0" x2="10" y2="20" stroke="#bdc3c7" stroke-width="1" opacity="0.5"></line>
        </pattern>
    </defs>

    <rect width="1200" height="800" fill="#fcfbf8"></rect>

    <g transform="translate(100, 100)">
        <circle cx="0" cy="0" r="25" fill="none" stroke="#2c3e50" stroke-width="2"></circle>
        <path d="M 0 -20 L 7 7 L 0 3 L -7 7 Z" fill="#2c3e50"></path>
        <text x="0" y="-30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">N</text>
    </g>

    <rect x="250" y="100" width="700" height="650" fill="url(#gravel-pattern)" rx="20"></rect>
    <text x="600" y="730" class="room-title" font-weight="bold" text-anchor="middle" fill="#7f8c8d" opacity="0.8">CRUSHED GRAVEL MOTOR COURT</text>
    
    <rect x="360" y="140" width="480" height="560" class="roof-outline" fill="url(#roof-seam)"></rect>
    <text x="345" y="420" class="annotation" transform="rotate(-90 345,420)" text-anchor="middle" fill="#7f8c8d">STANDING SEAM METAL ROOF OVERHANG</text>

    <rect x="400" y="180" width="400" height="480" class="timber-beam"></rect>
    <line x1="400" y1="340" x2="800" y2="340" class="timber-beam"></line>
    <line x1="400" y1="500" x2="800" y2="500" class="timber-beam"></line>
    <line x1="600" y1="180" x2="600" y2="660" class="timber-beam"></line>

    <rect x="400" y="180" width="400" height="80" class="wall-cedar"></rect>
    
    <rect x="410" y="190" width="100" height="30" class="storage-hatch" fill="url(#storage-hatch-pattern)"></rect>
    <text x="460" y="210" class="dimension" text-anchor="middle">Tool Rack</text>

    <rect x="690" y="190" width="100" height="30" class="storage-hatch" fill="url(#storage-hatch-pattern)"></rect>
    <text x="740" y="210" class="dimension" text-anchor="middle">Car Supplies</text>

    <rect x="560" y="256" width="80" height="8" fill="#fdfaf0"></rect> 
    <path d="M 560 260 A 40 40 0 0 0 600 300" class="door-arc"></path>
    <line x1="560" y1="260" x2="600" y2="300" class="door-panel"></line>
    <path d="M 640 260 A 40 40 0 0 1 600 300" class="door-arc"></path>
    <line x1="640" y1="260" x2="600" y2="300" class="door-panel"></line>

    <rect x="480" y="260" width="20" height="10" class="ev-charger"></rect>
    <text x="490" y="285" class="annotation" fill="#27ae60" text-anchor="middle">L2 CHARGER</text>
    
    <rect x="700" y="260" width="20" height="10" class="ev-charger"></rect>
    <text x="710" y="285" class="annotation" fill="#27ae60" text-anchor="middle">L2 CHARGER</text>

    <rect x="390" y="170" width="20" height="20" class="timber-post"></rect> 
    <rect x="590" y="170" width="20" height="20" class="timber-post"></rect> 
    <rect x="790" y="170" width="20" height="20" class="timber-post"></rect> 
    
    <rect x="390" y="250" width="20" height="20" class="timber-post"></rect> 
    <rect x="790" y="250" width="20" height="20" class="timber-post"></rect> 

    <rect x="390" y="490" width="20" height="20" class="timber-post"></rect> 
    <rect x="790" y="490" width="20" height="20" class="timber-post"></rect> 

    <rect x="390" y="650" width="20" height="20" class="timber-post"></rect> 
    <rect x="790" y="650" width="20" height="20" class="timber-post"></rect> 

    <rect x="430" y="300" width="140" height="320" class="car-outline" rx="15"></rect>
    <text x="500" y="460" class="room-title" fill="#7f8c8d" opacity="0.6" text-anchor="middle">EV BAY 1</text>
    
    <rect x="630" y="300" width="140" height="320" class="car-outline" rx="15"></rect>
    <text x="700" y="460" class="room-title" fill="#7f8c8d" opacity="0.6" text-anchor="middle">EV BAY 2</text>

    <rect x="860" y="480" width="40" height="20" fill="#bdc3c7" rx="4"></rect>
    <rect x="910" y="480" width="40" height="20" fill="#bdc3c7" rx="4"></rect>
    <rect x="960" y="480" width="40" height="20" fill="#bdc3c7" rx="4"></rect>
    <rect x="1010" y="480" width="40" height="20" fill="#bdc3c7" rx="4"></rect>
    <text x="940" y="470" class="annotation" fill="#34495e" text-anchor="middle">LIMESTONE PATH TO MUDROOM</text>
    <path d="M 1060 490 L 1090 490 L 1080 480 M 1090 490 L 1080 500" fill="none" stroke="#2c3e50" stroke-width="2"></path>

    <text x="600" y="230" class="room-title" text-anchor="middle">CEDAR STORAGE VAULT</text>
    <text x="600" y="245" class="room-desc" text-anchor="middle">Secure, Weather-Tight Tool &amp; Utility Storage</text>

    <text x="600" y="620" class="room-title" text-anchor="middle">OPEN MOTOR BAYS</text>
    <text x="600" y="635" class="room-desc" text-anchor="middle">Heavy Timber Trusses Above</text>

    <line x1="400" y1="130" x2="800" y2="130" stroke="#2c3e50" stroke-width="1" stroke-dasharray="4,4"></line>
    <line x1="400" y1="125" x2="400" y2="135" stroke="#2c3e50" stroke-width="1"></line>
    <line x1="800" y1="125" x2="800" y2="135" stroke="#2c3e50" stroke-width="1"></line>
    <text x="600" y="120" class="dimension" text-anchor="middle">20&#39; - 0&#34;</text>

    <line x1="830" y1="180" x2="830" y2="660" stroke="#2c3e50" stroke-width="1" stroke-dasharray="4,4"></line>
    <line x1="825" y1="180" x2="835" y2="180" stroke="#2c3e50" stroke-width="1"></line>
    <line x1="825" y1="660" x2="835" y2="660" stroke="#2c3e50" stroke-width="1"></line>
    <text x="840" y="420" class="dimension" transform="rotate(90 840,420)" text-anchor="middle">24&#39; - 0&#34;</text>
</svg>