<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        
        <pattern id="pex-slab" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="#fffaf0"></rect>
            <path d="M 0 10 Q 5 0 10 10 T 20 10" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.3"></path>
            <path d="M 0 20 Q 5 10 10 20 T 20 20" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.3"></path>
        </pattern>
        <pattern id="storage-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="8" stroke="#e6b0aa" stroke-width="2"></line>
        </pattern>
        <pattern id="pool-ripple" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="#b8d8e8"></rect>
            <path d="M 0 20 Q 10 10 20 20 T 40 20" fill="none" stroke="#85c1e9" stroke-width="1" opacity="0.5"></path>
        </pattern>
    </defs>

    <rect width="1200" height="800" fill="#fdfaf0"></rect>

    <g transform="translate(100, 100)">
        <circle cx="0" cy="0" r="25" fill="none" stroke="#2c3e50" stroke-width="2"></circle>
        <path d="M 0 -20 L 7 7 L 0 3 L -7 7 Z" fill="#2c3e50"></path>
        <text x="0" y="-30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">N</text>
    </g>

    <rect x="120" y="120" width="760" height="560" fill="none" stroke="#dcd7cb" stroke-width="20" opacity="0.4"></rect>
    <text x="350" y="130" class="annotation" fill="#7f8c8d" opacity="0.8">36&#34; CRUSHED GRAVEL DRY ZONE (TERMITE/FIRE BARRIER)</text>

    <rect x="150" y="150" width="400" height="350" fill="url(#pex-slab)"></rect> 
    <rect x="550" y="350" width="300" height="300" fill="url(#pex-slab)"></rect> 
    <rect x="50" y="200" width="100" height="100" fill="url(#pex-slab)"></rect> 
    <text x="350" y="480" class="radiant-text" text-anchor="middle" opacity="0.8">GEOTHERMAL PEX SLAB RADIANT HEATING</text>
    <text x="700" y="630" class="radiant-text" text-anchor="middle" opacity="0.8">GEOTHERMAL PEX SLAB</text>

    <rect x="580" y="80" width="340" height="240" fill="#e8e4d9"></rect> 
    <rect x="610" y="110" width="280" height="180" fill="url(#pool-ripple)" stroke="#85c1e9" stroke-width="2"></rect> 
    <rect x="605" y="105" width="290" height="190" fill="none" stroke="#34495e" stroke-width="1" stroke-dasharray="2,2"></rect> 
    <rect x="890" y="110" width="20" height="180" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,2"></rect>
    <text x="920" y="200" class="annotation" transform="rotate(-90 920,200)" text-anchor="middle">SUB-SURFACE MOTORIZED COVER VAULT</text>

    <line x1="50" y1="200" x2="150" y2="200" class="wall-glass"></line>
    <line x1="50" y1="300" x2="150" y2="300" class="wall-glass"></line>
    
    <rect x="0" y="180" width="50" height="140" fill="#e0ddd5" stroke="#2c3e50" stroke-width="4"></rect>
    <text x="25" y="250" class="room-desc" font-weight="bold" transform="rotate(-90 25,250)" text-anchor="middle">MAIN BLOCK</text>

    <line x1="150" y1="150" x2="550" y2="150" class="wall-glass" stroke-width="8"></line> 
    <line x1="150" y1="150" x2="150" y2="200" class="wall-exterior-cedar"></line> 
    <line x1="150" y1="300" x2="150" y2="500" class="wall-exterior-cedar"></line> 
    <line x1="150" y1="500" x2="550" y2="500" class="wall-exterior-cedar"></line> 
    
    <rect x="550" y="350" width="300" height="300" class="wall-exterior-cedar" fill="none"></rect>

    <line x1="550" y1="350" x2="550" y2="500" class="wall-interior"></line> 
    <line x1="550" y1="450" x2="650" y2="450" class="wall-interior"></line> 
    <line x1="650" y1="350" x2="650" y2="450" class="wall-interior"></line> 

    <rect x="146" y="220" width="8" height="60" fill="#fdfaf0"></rect>
    <text x="140" y="255" class="dimension" transform="rotate(-90 140,255)" text-anchor="middle">OPEN</text>

    <rect x="546" y="460" width="8" height="40" fill="#fdfaf0"></rect>
    <path d="M 550 500 A 40 40 0 0 1 590 460" class="door-arc"></path>
    <line x1="550" y1="500" x2="590" y2="460" class="door-panel"></line>

    <rect x="646" y="400" width="8" height="30" fill="#fdfaf0"></rect>
    <path d="M 650 430 A 30 30 0 0 0 620 400" class="door-arc"></path>
    <line x1="650" y1="430" x2="620" y2="400" class="door-panel"></line>

    <rect x="580" y="346" width="40" height="8" fill="#fdfaf0"></rect>
    <path d="M 620 350 A 40 40 0 0 0 580 310" class="door-arc"></path>
    <line x1="620" y1="350" x2="580" y2="310" class="door-panel"></line>

    <g transform="translate(550, 150)">
        <line x1="0" y1="0" x2="0" y2="200" stroke="#dcd7cb" stroke-width="2" stroke-dasharray="10,10"></line> 
        <line x1="0" y1="0" x2="30" y2="40" stroke="#34495e" stroke-width="4"></line>
        <line x1="0" y1="40" x2="30" y2="80" stroke="#34495e" stroke-width="4"></line>
        <line x1="0" y1="80" x2="30" y2="120" stroke="#34495e" stroke-width="4"></line>
        <line x1="0" y1="120" x2="30" y2="160" stroke="#34495e" stroke-width="4"></line>
        <line x1="0" y1="160" x2="30" y2="200" stroke="#34495e" stroke-width="4"></line>
        <text x="50" y="100" class="annotation" fill="#34495e" text-anchor="middle" transform="rotate(90 50,100)">ZERO-THRESHOLD PIVOT PANELS</text>
    </g>

    <line x1="660" y1="350" x2="700" y2="350" class="window-seafoam"></line>
    <line x1="710" y1="350" x2="750" y2="350" class="window-seafoam"></line>
    <line x1="760" y1="350" x2="800" y2="350" class="window-seafoam"></line>
    <text x="730" y="340" class="annotation" fill="#16a085" text-anchor="middle">SEAFOAM-TRIM BANK</text>

    <line x1="700" y1="650" x2="780" y2="650" class="window-seafoam"></line>

    <line x1="850" y1="480" x2="850" y2="540" class="window-seafoam"></line>

    <line x1="200" y1="500" x2="280" y2="500" class="window-seafoam"></line>
    <line x1="320" y1="500" x2="400" y2="500" class="window-seafoam"></line>

    <rect x="820" y="360" width="30" height="100" class="storage" fill="url(#storage-hatch)"></rect>
    <rect x="820" y="560" width="30" height="80" class="storage" fill="url(#storage-hatch)"></rect>

    <rect x="740" y="500" width="100" height="120" fill="#fcfcfc" stroke="#bdc3c7" stroke-width="2" rx="4"></rect>
    <rect x="810" y="510" width="20" height="40" fill="#fff" stroke="#bdc3c7" stroke-width="1" rx="2"></rect>
    <rect x="810" y="570" width="20" height="40" fill="#fff" stroke="#bdc3c7" stroke-width="1" rx="2"></rect>

    <rect x="556" y="356" width="90" height="40" class="plumbing"></rect> 
    <text x="600" y="380" class="room-desc" fill="#2980b9" text-anchor="middle">SHOWER</text>
    <rect x="610" y="430" width="30" height="20" class="plumbing"></rect> 
    <circle cx="630" cy="410" r="10" class="plumbing"></circle> 

    <line x1="50" y1="250" x2="1150" y2="250" stroke="#c0392b" stroke-width="3" stroke-dasharray="12,6" opacity="0.6"></line>
    <text x="1000" y="240" font-family="Arial" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">RIGHT PASSAGE VISTA</text>
    <text x="1000" y="265" font-family="Arial" font-size="10" fill="#c0392b" text-anchor="end">(Unbroken sightline from Main Block to Canyon Edge)</text>

    <path d="M 500 350 Q 550 350 550 400" fill="none" stroke="#2c3e50" stroke-width="2" stroke-dasharray="4,4"></path>
    <text x="440" y="375" class="annotation" text-anchor="end">THE &#34;L-HINGE&#34; OFFSET</text>
    <text x="440" y="390" class="dimension" text-anchor="end">Breaks straight-line sound transmission</text>

    <rect x="250" y="160" width="200" height="25" fill="#fdfdfd" stroke="#34495e" stroke-width="1" rx="4" opacity="0.9"></rect>
    <text x="350" y="177" class="dimension" text-anchor="middle" font-weight="bold">HVAC ZONE: SPACEPAK HIGH-VELOCITY</text>

    <rect x="600" y="360" width="200" height="25" fill="#fdfdfd" stroke="#34495e" stroke-width="1" rx="4" opacity="0.9"></rect>
    <text x="700" y="377" class="dimension" text-anchor="middle" font-weight="bold">HVAC ZONE: INDEPENDENT MINI-SPLIT</text>

    <text x="350" y="290" class="room-title" text-anchor="middle">THE SUNROOM</text>
    <text x="350" y="310" class="room-desc" text-anchor="middle">680 SF Entertaining Space</text>
    <text x="350" y="325" class="dimension" text-anchor="middle">BASWA phon Acoustic Plaster Ceiling</text>

    <text x="700" y="480" class="room-title" text-anchor="middle">GUEST SUITE</text>
    <text x="700" y="495" class="room-desc" text-anchor="middle">&#34;Days Cottage&#34; Design</text>
    <text x="700" y="510" class="dimension" text-anchor="middle">Vaulted Cedar Shingle Interior</text>

    <text x="600" y="415" class="room-title" text-anchor="middle" font-size="12">POOL BATH</text>
    <text x="600" y="430" class="dimension" text-anchor="middle">Wet Vestibule</text>

    <text x="100" y="240" class="room-title" text-anchor="middle" font-size="12">GLASS</text>
    <text x="100" y="260" class="room-title" text-anchor="middle" font-size="12">BRIDGE</text>

    <text x="750" y="200" class="room-title" text-anchor="middle" fill="#2a5070">PERIMETER-OVERFLOW POOL</text>
    <text x="750" y="220" class="room-desc" text-anchor="middle" fill="#3a6080">Mirror-flat surface reflecting Texas sky</text>
</svg>