<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        
        <pattern id="concrete-slab-faint" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="#fcfbf8"></rect>
            <circle cx="10" cy="10" r="1" fill="#eaeded"></circle>
            <circle cx="30" cy="25" r="1" fill="#eaeded"></circle>
        </pattern>
        <pattern id="hardwood" width="20" height="60" patternUnits="userSpaceOnUse">
            <rect width="20" height="60" fill="#fdfaf0"></rect>
            <line x1="0" y1="0" x2="0" y2="60" stroke="#e0ddd5" stroke-width="1"></line>
            <line x1="0" y1="20" x2="20" y2="20" stroke="#e0ddd5" stroke-width="1"></line>
            <line x1="10" y1="0" x2="10" y2="60" stroke="#e0ddd5" stroke-width="1" opacity="0.5"></line>
            <line x1="0" y1="50" x2="20" y2="50" stroke="#e0ddd5" stroke-width="1"></line>
        </pattern>
    </defs>

    
    <rect width="1200" height="800" fill="#fcfbf8"></rect>

    
    <g transform="translate(100, 100)">
        <circle cx="0" cy="0" r="25" fill="none" stroke="#2c3e50" stroke-width="2"></circle>
        <path d="M 0 -20 L 7 7 L 0 3 L -7 7 Z" fill="#2c3e50"></path>
        <text x="0" y="-30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">N</text>
    </g>

    
    <rect x="300" y="280" width="600" height="240" fill="url(#concrete-slab-faint)" stroke="#dcd7cb" stroke-width="4" stroke-dasharray="10,10"></rect>
    <text x="510" y="405" font-family="Arial" font-size="24" font-weight="bold" fill="#eaeded" text-anchor="middle">OPEN TO GARAGE BELOW</text>

    
    <rect x="720" y="280" width="180" height="240" fill="url(#hardwood)"></rect>
    
    
    
    <path d="M 720 280 L 900 280 L 900 520 L 720 520" class="wall-exterior-outline"></path>
    <path d="M 720 280 L 900 280 L 900 520 L 720 520" class="wall-exterior-core"></path>
    
    <line x1="720" y1="280" x2="720" y2="520" class="wall-interior" stroke-width="10"></line>

    
    
    <line x1="720" y1="400" x2="900" y2="400" stroke="#a0522d" stroke-width="6" stroke-dasharray="24,12" opacity="0.4"></line>
    <text x="890" y="390" font-family="Arial" font-size="10" fill="#a0522d" text-anchor="end" opacity="0.8">ROOF RIDGE (VAULTED E-W)</text>
    
    <line x1="720" y1="340" x2="900" y2="340" stroke="#a0522d" stroke-width="8" opacity="0.3"></line>
    <line x1="720" y1="460" x2="900" y2="460" stroke="#a0522d" stroke-width="8" opacity="0.3"></line>
    
    <path d="M 880 290 Q 890 320 890 340" fill="none" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2,2"></path>
    <text x="875" y="305" font-family="Arial" font-size="8" fill="#7f8c8d" text-anchor="end">Ceiling slopes down to knee wall</text>
    <path d="M 880 510 Q 890 480 890 460" fill="none" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2,2"></path>
    <text x="875" y="495" font-family="Arial" font-size="8" fill="#7f8c8d" text-anchor="end">Ceiling slopes down to knee wall</text>

    
    
    <line x1="900" y1="370" x2="900" y2="430" class="window"></line>
    <text x="915" y="400" class="annotation" transform="rotate(90 915,400)" text-anchor="middle">EAST GABLE WINDOW</text>
    
    <line x1="840" y1="280" x2="880" y2="280" class="window" stroke-width="4"></line>
    <text x="860" y="270" class="annotation" text-anchor="middle">CROSS-VENTILATION</text>

    
    <rect x="730" y="290" width="80" height="35" fill="#e0ddd5" stroke="#34495e" stroke-width="2"></rect>
    <line x1="740" y1="290" x2="740" y2="325" stroke="#34495e" stroke-width="1"></line>
    <line x1="750" y1="290" x2="750" y2="325" stroke="#34495e" stroke-width="1"></line>
    <line x1="760" y1="290" x2="760" y2="325" stroke="#34495e" stroke-width="1"></line>
    <line x1="770" y1="290" x2="770" y2="325" stroke="#34495e" stroke-width="1"></line>
    <line x1="780" y1="290" x2="780" y2="325" stroke="#34495e" stroke-width="1"></line>
    <line x1="790" y1="290" x2="790" y2="325" stroke="#34495e" stroke-width="1"></line>
    <line x1="800" y1="290" x2="800" y2="325" stroke="#34495e" stroke-width="1"></line>
    <path d="M 780 307 L 740 307 L 750 297 M 740 307 L 750 317" fill="none" stroke="#2c3e50" stroke-width="2"></path>
    <text x="770" y="340" class="dimension" fill="#2c3e50" font-weight="bold" text-anchor="middle">Stairs From Workshop</text>
    
    
    <rect x="785" y="295" width="20" height="20" class="hatch"></rect>
    <text x="810" y="308" class="annotation" fill="#c0392b">STORM SHELTER HATCH</text>

    
    
    <rect x="730" y="335" width="50" height="6" fill="#1a1a1a" rx="2"></rect>
    <text x="755" y="352" class="dimension" text-anchor="middle">Screen</text>

    
    <path d="M 740 375 L 850 375 L 850 410 L 830 410 L 830 395 L 740 395 Z" class="furniture" rx="4"></path>
    
    <rect x="760" y="355" width="50" height="15" fill="#fcfcfc" stroke="#bdc3c7" stroke-width="1" rx="2"></rect>

    
    <circle cx="810" cy="465" r="22" class="furniture-wood"></circle>
    <circle cx="810" cy="465" r="8" fill="none" stroke="#f1c40f" stroke-width="2" stroke-dasharray="2,2"></circle> 
    
    <rect x="778" y="455" width="10" height="20" class="furniture" rx="2"></rect>
    <rect x="832" y="455" width="10" height="20" class="furniture" rx="2"></rect>
    <rect x="800" y="433" width="20" height="10" class="furniture" rx="2"></rect>
    <rect x="800" y="487" width="20" height="10" class="furniture" rx="2"></rect>
    <text x="810" y="470" font-family="Arial" font-size="9" fill="#8b5e3c" font-weight="bold" text-anchor="middle">Game Table</text>

    
    <rect x="860" y="350" width="18" height="40" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1" rx="2"></rect>
    <circle cx="869" cy="360" r="6" fill="#1abc9c"></circle>
    <text x="869" y="405" font-family="Arial" font-size="8" fill="#0e6251" transform="rotate(-90 869,405)" text-anchor="middle" font-weight="bold">PELOTON</text>

    
    <rect x="725" y="450" width="18" height="22" fill="#eaeded" stroke="#95a5a6" stroke-width="2" rx="1"></rect>
    <text x="745" y="465" class="dimension" text-anchor="start">Fridge</text>

    
    
    <circle cx="810" cy="425" r="8" class="tech-node"></circle>
    <circle cx="810" cy="425" r="2" fill="#2980b9"></circle>
    <text x="810" y="443" class="dimension" fill="#2980b9" font-weight="bold" text-anchor="middle">Wi-Fi 7 AP / Cat6a</text>

    
    <rect x="780" y="510" width="40" height="10" fill="#fdfdfd" stroke="#34495e" stroke-width="1"></rect>
    <text x="800" y="505" font-family="Arial" font-size="8" fill="#34495e" font-weight="bold" text-anchor="middle">MINI-SPLIT CASSETTE</text>

    
    <rect x="350" y="580" width="500" height="120" fill="#e0ddd5" opacity="0.2" rx="8"></rect>
    <text x="600" y="620" class="room-title" text-anchor="middle">THE LOFT</text>
    <text x="600" y="640" class="room-desc" text-anchor="middle">Vaulted Footprint Above Utility &amp; Workshop Bay</text>
    <text x="600" y="660" class="dimension" text-anchor="middle">Total Footprint: 18&#39; x 24&#39;</text>

</svg>